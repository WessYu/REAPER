<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">REAPER icon with transparent outer canvas</title>
  <desc id="desc">Original REAPER artwork, clipped only outside the existing rounded-square frame.</desc>
  <defs>
    <clipPath id="frame">
      <rect x="5" y="5" width="118" height="118" rx="20" ry="20"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <image href="reaper-icon.webp" x="0" y="0" width="128" height="128"/>
  </g>
</svg>
