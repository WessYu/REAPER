name: Format final hardening
on:
  push:
    branches:
      - feat/attack-engine-final-hardening
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attack-engine-final-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/attack.ts src/attack-config.ts src/model.ts test/attack.test.mjs
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/attack.ts src/attack-config.ts src/model.ts test/attack.test.mjs
          git diff --cached --quiet || git commit -m "style(runtime): apply final hardening format"
          git push origin HEAD:feat/attack-engine-final-hardening
