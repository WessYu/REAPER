name: Format final attack changes
on:
  push:
    branches:
      - feat/attack-engine-hardening-01
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attack-engine-hardening-01
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format latest offensive changes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin feat/attack-engine-hardening-01
            git reset --hard origin/feat/attack-engine-hardening-01
            npx prettier --write README.md CHANGELOG.md SECURITY.md docs src test
            git add README.md CHANGELOG.md SECURITY.md docs src test
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "style(attack): normalize final branch"
            if git push origin HEAD:feat/attack-engine-hardening-01; then
              exit 0
            fi
            git reset --hard HEAD~1
            sleep 1
          done
          exit 1
