name: Format commercial docs
on:
  push:
    branches:
      - feat/commercial-security-foundation
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-security-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write README.md CHANGELOG.md docs/commercial-architecture.md security/THREAT-MODEL.md
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs/commercial-architecture.md security/THREAT-MODEL.md
          git diff --cached --quiet || git commit -m "style(docs): format commercial security documentation"
          git push origin HEAD:feat/commercial-security-foundation
