name: Format attack config
on:
  push:
    branches:
      - feat/attack-engine-hardening-01
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attack-engine-hardening-01
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/attack-config.ts
      - name: Commit formatted output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/attack-config.ts
          git diff --cached --quiet || git commit -m "style(attack): format authorization-window changes"
          git push origin HEAD:feat/attack-engine-hardening-01
