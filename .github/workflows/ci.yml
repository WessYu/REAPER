name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  format-platform:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/reaper-platform-control-plane'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply repository formatter
        run: npx prettier --write platform test/integration/platform.mjs
      - name: Commit formatter output
        run: |
          if git diff --quiet -- platform test/integration/platform.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform test/integration/platform.mjs
          git commit -m "style(platform): apply repository formatter"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: reaper_synthetic_test
          POSTGRES_DB: reaper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: node --test --test-concurrency=1 test/integration/*.mjs
        env:
          REAPER_TEST_DATABASE_URL: postgres://postgres:reaper_synthetic_test@localhost:5432/reaper_test
      - run: npm pack
      - name: Verify installed CLI
        run: |
          npm install --prefix /tmp/reaper-install ./wess2001-reaper-*.tgz --ignore-scripts
          /tmp/reaper-install/node_modules/.bin/reaper --version
          /tmp/reaper-install/node_modules/.bin/reaper scan test/fixtures/secure --fail-on medium

      - name: Generate and verify supply-chain evidence
        if: matrix.node == 22
        run: |
          npm sbom --sbom-format cyclonedx > reaper.cdx.json
          node -e "const fs=require('node:fs'); const bom=JSON.parse(fs.readFileSync('reaper.cdx.json','utf8')); if (bom.bomFormat !== 'CycloneDX' || !bom.components?.length) process.exit(1)"
          node scripts/artifact-hashes.mjs write
          node scripts/artifact-hashes.mjs verify
          npm run release:evidence:check

      - name: Upload package and supply-chain evidence
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: reaper-supply-chain-evidence
          path: |
            wess2001-reaper-*.tgz
            reaper.cdx.json
            package-artifact-hashes.json
          if-no-files-found: error

      - name: Portfolio proof — vulnerable and secure fixtures
        if: matrix.node == 22
        run: |
          echo '$ reaper scan test/fixtures/vulnerable'
          /tmp/reaper-install/node_modules/.bin/reaper scan test/fixtures/vulnerable
          echo
          echo '$ reaper scan test/fixtures/secure --fail-on medium'
          /tmp/reaper-install/node_modules/.bin/reaper scan test/fixtures/secure --fail-on medium

  windows-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run check

  platform-runner-image:
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - name: Build hardened runner image
        run: docker build -f platform/Dockerfile -t reaper-platform-runner:ci .

  provenance:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, windows-quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reaper-supply-chain-evidence
      - name: Validate trusted release evidence
        run: node scripts/validate-release-evidence.mjs
      - name: Attest npm package and hash manifest
        uses: actions/attest@v4
        with:
          subject-path: "wess2001-reaper-*.tgz,package-artifact-hashes.json"
      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          sbom-path: reaper.cdx.json
