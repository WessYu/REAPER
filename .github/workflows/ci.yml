name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: reaper_synthetic_test
          POSTGRES_DB: reaper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node --test test/integration/postgres.mjs
        env:
          REAPER_TEST_DATABASE_URL: postgres://postgres:reaper_synthetic_test@localhost:5432/reaper_test
      - run: npm pack
      - name: Verify installed CLI
        run: |
          npm install --prefix /tmp/reaper-install ./wess2001-reaper-*.tgz --ignore-scripts
          /tmp/reaper-install/node_modules/.bin/reaper --version
          /tmp/reaper-install/node_modules/.bin/reaper scan test/fixtures/secure --fail-on medium
