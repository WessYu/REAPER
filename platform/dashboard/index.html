<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>REAPER Platform</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --panel: #111;
        --line: #242424;
        --muted: #8b8b8b;
        --text: #f3f3f3;
        --soft: #181818;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      .shell {
        max-width: 1240px;
        margin: 0 auto;
        padding: 32px;
      }
      .top {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }
      .brand h1 {
        font-size: 24px;
        letter-spacing: 0.16em;
        margin: 0;
      }
      .brand p {
        margin: 6px 0 0;
        color: var(--muted);
      }
      .token {
        display: flex;
        gap: 8px;
      }
      .token input {
        width: 360px;
      }
      .input,
      button {
        background: var(--soft);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 8px;
        padding: 10px 12px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        border-color: #555;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px;
      }
      .span4 {
        grid-column: span 4;
      }
      .span8 {
        grid-column: span 8;
      }
      .span12 {
        grid-column: span 12;
      }
      .label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
      }
      .metric {
        font-size: 34px;
        margin-top: 8px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }
      .row:first-child {
        border-top: 0;
      }
      .status {
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 8px;
        color: #d0d0d0;
      }
      .muted {
        color: var(--muted);
      }
      .hidden {
        display: none;
      }
      .error {
        border-color: #6b2c2c;
        color: #ffb4b4;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .toolbar input {
        min-width: 220px;
      }
      .empty {
        padding: 28px 0;
        color: var(--muted);
      }
      @media (max-width: 800px) {
        .shell {
          padding: 20px;
        }
        .top {
          align-items: stretch;
          flex-direction: column;
        }
        .token input {
          width: 100%;
        }
        .span4,
        .span8,
        .span12 {
          grid-column: span 12;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <div class="brand">
          <h1>REAPER</h1>
          <p>Commercial security control plane</p>
        </div>
        <div class="token">
          <input
            id="token"
            class="input"
            type="password"
            autocomplete="off"
            placeholder="reaper_live_…"
          /><button id="connect">Connect</button>
        </div>
      </header>

      <div id="notice" class="card error hidden"></div>
      <section class="grid">
        <article class="card span4">
          <div class="label">Workspace</div>
          <div id="workspace" class="metric">—</div>
          <div id="principal" class="muted"></div>
        </article>
        <article class="card span4">
          <div class="label">Projects</div>
          <div id="projectCount" class="metric">—</div>
        </article>
        <article class="card span4">
          <div class="label">Runs</div>
          <div id="runCount" class="metric">—</div>
        </article>

        <article class="card span12">
          <div class="toolbar">
            <strong>Runs</strong>
            <span style="flex: 1"></span>
            <button id="refresh">Refresh</button>
          </div>
          <div id="runs" class="empty">
            Connect with an API key to load workspace data.
          </div>
        </article>

        <article class="card span12">
          <div class="toolbar">
            <strong>Create project</strong>
            <input id="projectName" class="input" placeholder="Project name" />
            <button id="createProject">Create</button>
          </div>
        </article>
      </section>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let token = sessionStorage.getItem("reaper.token") || "";
      $("token").value = token;
      function headers(json = false) {
        return {
          authorization: "Bearer " + token,
          ...(json ? { "content-type": "application/json" } : {}),
        };
      }
      async function api(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: {
            ...headers(Boolean(options.body)),
            ...(options.headers || {}),
          },
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Request failed");
        return data;
      }
      function fail(error) {
        $("notice").textContent = error.message || String(error);
        $("notice").classList.remove("hidden");
      }
      function clearFail() {
        $("notice").classList.add("hidden");
      }
      function runRow(run) {
        const div = document.createElement("div");
        div.className = "row";
        const left = document.createElement("div");
        const title = document.createElement("div");
        title.textContent = run.target_origin;
        const meta = document.createElement("div");
        meta.className = "muted";
        meta.textContent =
          run.environment + " · " + new Date(run.created_at).toLocaleString();
        left.append(title, meta);
        const status = document.createElement("span");
        status.className = "status";
        status.textContent = run.status;
        div.append(left, status);
        return div;
      }
      async function refresh() {
        clearFail();
        try {
          const [me, projects, runs] = await Promise.all([
            api("/v1/me"),
            api("/v1/projects"),
            api("/v1/runs"),
          ]);
          $("workspace").textContent = me.workspaceId.slice(0, 8);
          $("principal").textContent = me.principalId + " · " + me.role;
          $("projectCount").textContent = projects.items.length;
          $("runCount").textContent = runs.items.length;
          $("runs").replaceChildren(
            ...(runs.items.length
              ? runs.items.map(runRow)
              : [
                  Object.assign(document.createElement("div"), {
                    className: "empty",
                    textContent: "No runs yet.",
                  }),
                ]),
          );
        } catch (e) {
          fail(e);
        }
      }
      $("connect").onclick = () => {
        token = $("token").value.trim();
        sessionStorage.setItem("reaper.token", token);
        void refresh();
      };
      $("refresh").onclick = () => void refresh();
      $("createProject").onclick = async () => {
        clearFail();
        try {
          await api("/v1/projects", {
            method: "POST",
            body: JSON.stringify({ name: $("projectName").value }),
          });
          $("projectName").value = "";
          await refresh();
        } catch (e) {
          fail(e);
        }
      };
      if (token) void refresh();
    </script>
  </body>
</html>
